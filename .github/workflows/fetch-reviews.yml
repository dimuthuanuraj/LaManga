name: Fetch Google Reviews

on:
  schedule:
    # Runs every day at 6:00 AM UTC (11:30 AM Sri Lanka time)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Google Reviews
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PLACE_ID: 'ChIJSSh5EMs_4ToRG2erPYwrHW8'
        run: node scripts/fetch-reviews.js

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/google-reviews.json
          git diff --staged --quiet || git commit -m "chore: update Google reviews [automated]"
          git push
